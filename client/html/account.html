<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Shared aside styles -->
    <link rel="stylesheet" href="../../client/css/aside.css" />
    <link rel="stylesheet" href="../../client/css/account.css" />
    <link rel="stylesheet" href="../../global.css" />
  </head>
  <body>
    <div class="page-shell">

      <!-- ============================================================
           ASIDE — Left navigation panel
      ============================================================ -->
      <nav class="menu">
        <a class="menu__item menu__logo" href="./home.html">
          <img src="../../assets/images/icon1..svg" class="image" alt="Logo" />
        </a>

        <div class="menu__nav-group">
          <a class="menu__item" href="./home.html">
            <img src="../../assets/images/home.icon2.svg" alt="Home" />
          </a>

          <a class="menu__item" href="./search-panel.html">
            <img src="../../assets/images/home.icon3.svg" alt="Search" />
          </a>
          <a class="menu__item active" href="./account.html">
            <img src="../../assets/images/account-icon-active.svg" alt="Account" />
          </a>
          <a class="menu__item" href="./favorite.html">
            <img src="../../assets/images/home.icon5.svg" alt="Favorites" />
          </a>


        </div>
      </nav>
      <!-- /ASIDE -->

      <!-- ============================================================
           MAIN CONTENT — User account page
      ============================================================ -->
      <main class="page-main">
        <section class="account-wrap">
          <div class="account-card">
            <div class="profile-avatar" id="avatarWrapper">
              <img id="profilePreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='100' fill='%23222'/%3E%3Cpath d='M100 90c13.8 0 25-11.2 25-25S113.8 40 100 40 75 51.2 75 65s11.2 25 25 25zm0 15c-22.1 0-65 11.1-65 33v17h130v-17c0-21.9-42.9-33-65-33z' fill='%23555'/%3E%3C/svg%3E" alt="Profile" />
            </div>

            <input
              id="profileImageFileInput"
              type="file"
              accept="image/*"
              style="display: none;"
              aria-label="Select profile image from local"
            />

            <form class="account-form" id="accountForm">
              <div class="form-group">
                <span class="input-icon">
                  <i class="fa-regular fa-image"></i>
                </span>
                <input
                  id="profileImageUrlInput"
                  type="text"
                  placeholder="Profile image url"
                />
              </div>

              <div class="form-group">
                <span class="input-icon">
                  <i class="fa-regular fa-user"></i>
                </span>
                <input type="text" placeholder="Full name" />
                
              </div>

              <div class="form-group">
                <span class="input-icon">
                  <img src="../../assets/images/admin.username.svg" alt="email icon" />
                </span>
                <input type="email" value="example@example.com" disabled />
              </div>

              <div class="form-group">
                <span class="input-icon">
                  <img src="../../assets/images/admin.password.svg" alt="password icon" />
                </span>
                <input id="passwordInput" type="password" placeholder="Password" />
                <button class="toggle-eye" id="togglePassword" type="button" aria-label="Toggle password visibility">
                  <img src="../../assets/images/password-toggle.svg" alt="toggle password visibility" />
                </button>
              </div>

              <button type="submit" class="save-btn">Save</button>
            </form>
          </div>
        </section>
      </main>
      <!-- /MAIN CONTENT -->

    </div>
    <script src="../js/account.js"></script>
  </body>
</html>
