<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Toast Notification</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #171616;
            --accent-purple: #4d8125;
            --text-white: #ffffff;
            --text-gray: #aaa;
            --duration: 4s; /* Vaxtı buradan dəyişə bilərsən */
        }

        body {
            background-color: #0f0f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
        }

        /* Toast Card */
        .modern-toast {
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 320px;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 15px;
            
            /* Animasiyalar: Giriş və 4 saniyə sonra çıxış */
            animation: slideIn 0.5s ease forwards, fadeOut 0.5s ease var(--duration) forwards;
        }

        /* İkon */
        .toast-icon {
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        /* Mətnlər */
        .toast-details {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .toast-title {
            color: var(--text-white);
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .toast-msg {
            color: var(--text-gray);
            font-size: 14px;
        }

        /* Bağlama düyməsi */
        .toast-close {
            color: #444;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            padding: 5px;
        }

        .toast-close:hover {
            color: var(--text-white);
        }

        /* --- Azalan Progress Bar --- */
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: linear-gradient(to right, transparent, var(--accent-purple));
            /* 4 saniyə ərzində width 100%-dən 0%-ə düşür */
            animation: progressRun var(--duration) linear forwards;
        }

        /* Animasiya Keyframeləri */
        @keyframes slideIn {
            from { transform: translateX(110%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(20px); opacity: 0; visibility: hidden; }
        }

        @keyframes progressRun {
            from { width: 100%; }
            to { width: 0%; }
        }

        /* Test düyməsi stili */
        .btn-test {
            padding: 12px 24px;
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>



</head>
<body>


    <div class="toast-container" id="toastContainer">
        </div>

    <script>
       
    </script>
    <script type="module" src="./admin/js/comment.js"></script>
</body>
</html>
